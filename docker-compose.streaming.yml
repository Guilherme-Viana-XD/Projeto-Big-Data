services:
  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: projeto_bigdata_hdfs_init
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - namenode
    entrypoint: /bin/bash
    command: >
      -c "
      until hdfs dfs -fs hdfs://namenode:9000 -ls / >/dev/null 2>&1; do
        sleep 2;
      done;
      hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /ecommerce/raw;
      "

  jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    image: projeto-big-data-flink:local
    container_name: projeto_bigdata_flink_jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        execution.checkpointing.interval: 10s
    volumes:
      - ./flink:/workspace/flink
    depends_on:
      hdfs-init:
        condition: service_completed_successfully

  taskmanager:
    image: projeto-big-data-flink:local
    container_name: projeto_bigdata_flink_taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    volumes:
      - ./flink:/workspace/flink
    depends_on:
      - jobmanager

  hbase:
    build:
      context: .
      dockerfile: hbase/Dockerfile
    image: projeto-big-data-hbase:local
    container_name: projeto_bigdata_hbase
    hostname: hbase
    ports:
      - "16010:16010"
    volumes:
      - hbase_data:/data

volumes:
  hbase_data: